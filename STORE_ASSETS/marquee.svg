<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#14133B"/>
      <stop offset="100%" stop-color="#2D0B44"/>
    </linearGradient>
    <linearGradient id="mGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="mFilter">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#mBg)"/>
  <circle cx="260" cy="220" r="220" fill="#6366F1" opacity="0.25" filter="url(#mFilter)"/>
  <circle cx="1180" cy="400" r="200" fill="#EC4899" opacity="0.2" filter="url(#mFilter)"/>

  <!-- Logo Emblem -->
  <g transform="translate(180, 140)" filter="url(#mFilter)">
    <rect width="140" height="140" rx="36" fill="#0F172A" stroke="#818CF8" stroke-width="3"/>
    <path d="M 96 52 A 38 38 0 1 0 96 104" fill="none" stroke="url(#mGlow)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 50 78 L 65 78 L 76 60 L 88 94 L 98 78 L 110 78" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(360, 200)">
    <text y="0" font-family="-apple-system, system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2">CADENCE</text>
    <text y="46" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#818CF8" letter-spacing="3">PREMIUM HABIT &amp; PERFORMANCE WORKSPACE</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(360, 310)">
    <rect x="0" y="0" width="190" height="46" rx="23" fill="#1E293B" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="95" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E0E7FF" text-anchor="middle">🎯 Habit Streaks</text>

    <rect x="210" y="0" width="190" height="46" rx="23" fill="#1E293B" stroke="#A855F7" stroke-opacity="0.4"/>
    <text x="305" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F3E8FF" text-anchor="middle">⏱️ Focus Sprints</text>

    <rect x="420" y="0" width="190" height="46" rx="23" fill="#1E293B" stroke="#EC4899" stroke-opacity="0.4"/>
    <text x="515" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FCE7F3" text-anchor="middle">🌧️ Soundscapes</text>

    <rect x="630" y="0" width="210" height="46" rx="23" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="735" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#D1FAE5" text-anchor="middle">🛡️ Focus Guard Blocker</text>
  </g>

  <g transform="translate(360, 410)">
