    <text x="420" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">✨ Transform Every New Tab Into A High-Performance Zen Dashboard</text>
